server:
  port: ${PORT:8085}

spring:
  application:
    name: pagos-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pagos_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  gateway-url: ${GATEWAY_URL:http://localhost:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
