server:
  port: ${PORT:8084}

spring:
  application:
    name: pedidos-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pedidos_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  gateway-url: ${GATEWAY_URL:http://localhost:8080}
  # URLs internas de los otros microservicios (en docker-compose: http://productos-service:8082, etc.)
  servicios:
    productos: ${PRODUCTOS_URL:http://localhost:8082}
    inventario: ${INVENTARIO_URL:http://localhost:8083}
    pagos: ${PAGOS_URL:http://localhost:8085}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
